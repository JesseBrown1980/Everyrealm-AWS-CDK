name: Deploy Bonus App Infrastructure

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  NODE_VERSION: '18'

jobs:
  deploy:
    name: Deploy CDK Stacks
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint and build
        run: |
          npm run lint -- --quiet || true
          npm run build

      - name: Build services
        run: |
          cd services/user-service && npm ci --legacy-peer-deps && npm run build
          cd ../admin-service && npm ci --legacy-peer-deps && npm run build

      - name: Cleanup and Bootstrap CDK
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: |
          BUCKET_NAME="cdk-hnb659fds-assets-$CDK_DEFAULT_ACCOUNT-$CDK_DEFAULT_REGION"
          if aws s3api head-bucket --bucket $BUCKET_NAME 2>/dev/null; then
            aws s3 rm s3://$BUCKET_NAME --recursive || true
          fi
          npx cdk bootstrap --force

      - name: Deploy CDK Stacks
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
        run: |
          echo "Deploying to $DEPLOYMENT_ENVIRONMENT from ${{ github.ref }}"
          CDK_OPTIONS="--require-approval never --context env=$DEPLOYMENT_ENVIRONMENT --context domainName=$DOMAIN_NAME --context hostedZoneId=$HOSTED_ZONE_ID --context certificateArn=$CERTIFICATE_ARN"

          npx cdk synth
          npx cdk deploy BonusApp-DynamoDB-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS
          npx cdk deploy BonusApp-ECS-Cluster-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS || true
          npx cdk deploy BonusApp-UserService-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS || true
          npx cdk deploy BonusApp-AdminService-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS || true

          if aws cloudformation describe-stacks --stack-name bonus-app-alb-$DEPLOYMENT_ENVIRONMENT > /dev/null 2>&1; then
            npx cdk deploy BonusApp-ALB-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS || true
          else
            npx cdk deploy BonusApp-ALB-$DEPLOYMENT_ENVIRONMENT $CDK_OPTIONS || true
          fi

          echo "Deployment completed: Branch=${{ github.ref }}, Environment=$DEPLOYMENT_ENVIRONMENT"

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Successfully deployed to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          else
            echo "Failed to deploy infrastructure"
          fi
